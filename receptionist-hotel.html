<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reception Desk - Udy Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Udy Hotel - Front Desk (Main Branch)</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="admin.html">Admin Portal</a>
      <a href="receptionist-hotel.html">Hotel Desk</a>
      <a href="receptionist-apt.html">Apartment Desk</a>
    </nav>
  </header>

  <div class="container">
    <h2>Hotel Front Desk Management</h2>

    <div class="card">
      <h3>Walk-In Guest Registration</h3>
      <form id="walkInForm">
        <label>Guest Full Name</label>
        <input type="text" id="guestName" placeholder="Jane Doe" required>

        <label>Select Room</label>
        <select id="hotelRoomSelect" required>
          <option value="">Loading hotel rooms...</option>
        </select>

        <label>Check-In Date</label>
        <input type="date" id="checkInDate" required>

        <label>Check-Out Date</label>
        <input type="date" id="checkOutDate" required>

        <button type="submit">Check-In Guest</button>
      </form>
    </div>

    <div class="card">
      <h3>Active Hotel Guests & History</h3>
      <table>
        <thead>
          <tr>
            <th>Guest Name</th>
            <th>Room</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="hotelBookingsTable">
          <tr><td colspan="5">Loading guest records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { db, collection, addDoc, onSnapshot } from "./app.js";

    const hotelRoomSelect = document.getElementById('hotelRoomSelect');
    const hotelBookingsTable = document.getElementById('hotelBookingsTable');
    const walkInForm = document.getElementById('walkInForm');

    // Real-time listener for hotel rooms
    onSnapshot(collection(db, "rooms"), (snapshot) => {
      let options = '<option value="">Select a room</option>';
      snapshot.forEach((doc) => {
        const room = doc.data();
        if (room.propertyType === 'hotel') {
          options += `<option value="${room.name}">${room.name} ($${room.price}/night)</option>`;
        }
      });
      hotelRoomSelect.innerHTML = options;
    });

    // Handle walk-in booking
    walkInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const guestName = document.getElementById('guestName').value;
      const roomName = hotelRoomSelect.value;
      const checkIn = document.getElementById('checkInDate').value;
      const checkOut = document.getElementById('checkOutDate').value;

      try {
        await addDoc(collection(db, "bookings"), {
          propertyType: 'hotel',
          guestName,
          roomName,
          checkIn,
          checkOut,
          status: 'Checked-In',
          createdAt: new Date()
        });
        alert('Guest checked in successfully!');
        walkInForm.reset();
      } catch (error) {
        console.error("Error checking in guest:", error);
        alert('Failed to register booking.');
      }
    });

    // Real-time listener for hotel bookings
    onSnapshot(collection(db, "bookings"), (snapshot) => {
      let html = '';
      snapshot.forEach((doc) => {
        const b = doc.data();
        if (b.propertyType === 'hotel') {
          html += `
            <tr>
              <td>${b.guestName}</td>
              <td>${b.roomName}</td>
              <td>${b.checkIn}</td>
              <td>${b.checkOut}</td>
              <td>${b.status}</td>
            </tr>
          `;
        }
      });
      if (html === '') html = '<tr><td colspan="5">No active guests at the hotel.</td></tr>';
      hotelBookingsTable.innerHTML = html;
    });
  </script>
</body>
</html>
