<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udy Hotel & Apartments | Lagos</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary-color: #0d0d0d;
      --secondary-color: #d4af37;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --card-bg: #141416;
      --border-color: #27272a;
    }
    body {
      background-color: var(--primary-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(13, 13, 13, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-area img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--secondary-color);
    }
    .logo-area span {
      letter-spacing: 3px;
      font-weight: 700;
      color: var(--secondary-color);
      font-size: 1.1rem;
    }
    .hero-section {
      padding: 6rem 1rem 4rem 1rem;
      text-align: center;
      background: linear-gradient(to bottom, #111, var(--primary-color));
    }
    .hero-section h4 {
      color: var(--secondary-color);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }
    .hero-section h1 {
      font-size: 3rem;
      margin: 0 0 1rem 0;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .hero-section p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 3rem auto;
      font-size: 1rem;
      line-height: 1.6;
    }
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 4rem;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.9rem 2.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      font-size: 0.85rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: var(--secondary-color);
      color: var(--primary-color);
      border-color: var(--secondary-color);
    }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 6rem 1.5rem;
    }
    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .room-card:hover {
      transform: translateY(-5px);
      border-color: var(--secondary-color);
    }
    .room-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .room-info {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .room-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--secondary-color);
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .room-title {
      font-size: 1.4rem;
      font-weight: 400;
      margin: 0 0 1rem 0;
    }
    .room-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }
    .room-price {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--secondary-color);
    }
    .room-price span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: normal;
    }
    .book-btn {
      background: transparent;
      color: var(--secondary-color);
      border: 1px solid var(--secondary-color);
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 1px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .book-btn:hover {
      background: var(--secondary-color);
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <img src="logo.jpeg" alt="Udy Logo">
      <span>UDY HOTEL & APARTMENTS</span>
    </div>
    <nav>
      <a href="admin.html" style="color: var(--secondary-color); text-decoration: none; font-size: 0.8rem; letter-spacing: 1px; font-weight: 600; text-transform: uppercase;">Admin Portal</a>
    </nav>
  </header>

  <!-- Hero & Content Section -->
  <section class="hero-section">
    <h4>Accommodations in Lagos</h4>
    <h1>OUR ROOMS & APARTMENTS</h1>
    <p>Each space is a private retreat, designed with meticulous attention to detail, uncompromising luxury, and refined Nigerian hospitality.</p>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" id="hotelTabBtn" onclick="switchCategory('hotel')">HOTEL ROOMS</button>
      <button class="tab-btn" id="apartmentTabBtn" onclick="switchCategory('apartment')">APARTMENT UNITS</button>
    </div>

    <!-- Live Dynamic Rooms Grid -->
    <div id="liveRoomsContainer" class="rooms-grid">
      <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Loading refined living spaces...</p>
    </div>
  </section>

  <script type="module">
    import { db, collection, onSnapshot } from "./app.js";

    let allRoomsList = [];
    let currentCategory = 'hotel'; // Default view matches hotel tab

    window.switchCategory = function(category) {
      currentCategory = category;
      document.getElementById('hotelTabBtn').classList.toggle('active', category === 'hotel');
      document.getElementById('apartmentTabBtn').classList.toggle('active', category === 'apartment');
      renderRooms();
    }

    function renderRooms() {
      const container = document.getElementById('liveRoomsContainer');
      const filtered = allRoomsList.filter(r => r.propertyType === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 3rem; font-size: 0.95rem;">No ${currentCategory} units currently available.</p>`;
        return;
      }

      let html = '';
      filtered.forEach(r => {
        html += `
          <div class="room-card">
            <img src="${r.imageUrl}" alt="${r.name}">
            <div class="room-info">
              <div>
                <div class="room-badge">${r.propertyType} Retreat</div>
                <h3 class="room-title">${r.name}</h3>
              </div>
              <div class="room-footer">
                <div class="room-price">$${r.price} <span>/ night</span></div>
                <button class="book-btn" onclick="alert('Inquiry/Reservation requested for ${r.name}')">VIEW & BOOK</button>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Real-Time Listener from Firestore Database
    onSnapshot(collection(db, "rooms"), (snapshot) => {
      allRoomsList = [];
      snapshot.forEach((doc) => {
        allRoomsList.push({ id: doc.id, ...doc.data() });
      });
      renderRooms();
    });
  </script>
</body>
</html>
