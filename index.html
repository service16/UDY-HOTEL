<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udy Hotel & Apartments - Bookings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Udy Hotel & Apartments</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="admin.html">Admin Portal</a>
      <a href="receptionist-hotel.html">Hotel Desk</a>
      <a href="receptionist-apt.html">Apartment Desk</a>
    </nav>
  </header>

  <div class="container">
    <h2>Welcome to Udy Hotel</h2>
    <p>Select your preferred location and check real-time availability.</p>

    <div class="card">
      <h3>Filter Listings</h3>
      <label>Location / Property Type:</label>
      <select id="propertyFilter">
        <option value="all">All Properties</option>
        <option value="hotel">Udy Hotel (Main Branch)</option>
        <option value="apartment">Udy Apartments (City Annex)</option>
      </select>
    </div>

    <div id="listingsContainer">
      <!-- Real-time listings load here -->
      <p>Loading available rooms and apartments...</p>
    </div>
  </div>
</body>
</html>
