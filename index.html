<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udy Hotel & Apartments</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }
    .tab-btn {
      background: #18181b;
      color: var(--text-muted);
      border: 1px solid #3f3f46;
      padding: 0.75rem 2rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: var(--secondary-color);
      color: var(--primary-color);
      border-color: var(--secondary-color);
    }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .room-card {
      background: var(--card-bg);
      border: 1px solid #27272a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .room-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .room-info {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <img src="logo.jpeg" alt="Udy Logo">
      <span>UDY HOTEL</span>
    </div>
    <nav>
      <a href="admin.html" style="color: var(--secondary-color); text-decoration: none; font-size: 0.85rem; font-weight: bold;">Admin Login</a>
    </nav>
  </header>

  <!-- Hero & Rooms Section -->
  <section style="padding: 4rem 1rem; text-align: center;">
    <div style="max-width: 800px; margin: 0 auto;">
      <h4 style="color: var(--secondary-color); letter-spacing: 2px; text-transform: uppercase; font-size: 0.85rem;">Accommodations</h4>
      <h1 style="font-size: 2.5rem; margin: 0.5rem 0 1rem 0;">OUR ROOMS & APARTMENTS</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Each space is a private retreat, designed with meticulous attention to detail and uncompromising luxury.</p>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" id="hotelTabBtn" onclick="switchCategory('hotel')">HOTEL ROOMS</button>
      <button class="tab-btn" id="apartmentTabBtn" onclick="switchCategory('apartment')">APARTMENT UNITS</button>
    </div>

    <!-- Dynamic Room Grid Container -->
    <div id="liveRoomsContainer" class="rooms-grid">
      <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Loading real-time rooms and pricing...</p>
    </div>
  </section>

  <script type="module">
    import { db, collection, onSnapshot } from "./app.js";

    let allRoomsList = [];
    let currentCategory = 'hotel'; // Default view

    window.switchCategory = function(category) {
      currentCategory = category;
      document.getElementById('hotelTabBtn').classList.toggle('active', category === 'hotel');
      document.getElementById('apartmentTabBtn').classList.toggle('active', category === 'apartment');
      renderRooms();
    }

    function renderRooms() {
      const container = document.getElementById('liveRoomsContainer');
      const filtered = allRoomsList.filter(r => r.propertyType === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 2rem;">No ${currentCategory} units available at the moment.</p>`;
        return;
      }

      let html = '';
      filtered.forEach(r => {
        html += `
          <div class="room-card">
            <img src="${r.imageUrl}" alt="${r.name}">
            <div class="room-info">
              <div>
                <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-color); font-weight: bold; margin-bottom: 0.3rem;">${r.propertyType} Unit</div>
                <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">${r.name}</h3>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; border-top: 1px solid #27272a; padding-top: 1rem;">
                <span style="font-size: 1.1rem; font-weight: bold; color: var(--secondary-color);">$${r.price} <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">/ night</span></span>
                <button onclick="alert('Proceeding to reserve ${r.name}')" style="background: var(--secondary-color); color: var(--primary-color); border: none; padding: 0.5rem 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">Book Now</button>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Real-Time Listener from Firestore Database
    onSnapshot(collection(db, "rooms"), (snapshot) => {
      allRoomsList = [];
      snapshot.forEach((doc) => {
        allRoomsList.push({ id: doc.id, ...doc.data() });
      });
      renderRooms();
    });
  </script>
</body>
</html>
