<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udy Hotel - Front Desk Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between">
            <div>
                <div class="px-6 py-6 border-b border-slate-800 flex items-center space-x-3">
                    <i class="fa-solid fa-hotel text-amber-400 text-2xl"></i>
                    <div>
                        <span class="text-lg font-bold text-white tracking-wide block leading-tight">Udy Hotel</span>
                        <span class="text-xs text-amber-400 font-medium">Front Desk</span>
                    </div>
                </div>
                <nav class="mt-6 px-4 space-y-1">
                    <a href="admin.html" class="flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg transition"><i class="fa-solid fa-chart-pie w-5"></i><span>Admin Dashboard</span></a>
                    <a href="hotel-desk.html" class="flex items-center space-x-3 px-4 py-3 bg-amber-500 text-slate-950 font-semibold rounded-lg shadow-sm transition"><i class="fa-solid fa-hotel w-5"></i><span>Hotel Desk</span></a>
                    <a href="apartment-desk.html" class="flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg transition"><i class="fa-solid fa-house-chimney w-5"></i><span>Apartment Desk</span></a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 z-10">
                <h1 class="text-xl font-bold text-slate-800">Hotel Reception Desk (Live Rooms)</h1>
                <span class="text-sm font-medium text-slate-600">Status: <strong class="text-emerald-600">Active</strong></span>
            </header>

            <main class="p-8 space-y-8">
                <!-- Room Grid Status -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-slate-800">Live Hotel Room Status & Check-Ins</h2>
                    </div>
                    <div id="hotel-units-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase/firestore.js";

        onSnapshot(collection(db, "units"), (snapshot) => {
            const grid = document.getElementById('hotel-units-grid');
            grid.innerHTML = '';
            snapshot.forEach((docSnap) => {
                let unit = { id: docSnap.id, ...docSnap.data() };
                if (unit.category === 'Hotel Room') {
                    let badgeColor = unit.status === 'Available' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700';
                    grid.innerHTML += `
                        <div class="border border-slate-200 rounded-xl p-4 shadow-sm bg-white space-y-3">
                            <img src="${unit.image || 'https://images.unsplash.com/photo-1566073771259-6a8506099945'}" class="w-full h-36 object-cover rounded-lg">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-slate-900">${unit.name}</h3>
                                    <p class="text-sm text-emerald-600 font-semibold">$${unit.price} / night</p>
                                </div>
                                <span class="px-2.5 py-1 ${badgeColor} rounded-full text-xs font-semibold">${unit.status}</span>
                            </div>
                            <div class="flex space-x-2 pt-2">
                                <button onclick="window.updateStatus('${unit.id}', 'Available')" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium">Set Available</button>
                                <button onclick="window.updateStatus('${unit.id}', 'Booked')" class="flex-1 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-xs font-bold">Mark Booked</button>
                            </div>
                        </div>
                    `;
                }
            });
        });

        window.updateStatus = async function(id, newStatus) {
            try {
                await updateDoc(doc(db, "units", id), { status: newStatus });
            } catch(err) {
                alert("Error updating status");
            }
        }
    </script>
</body>
</html>
