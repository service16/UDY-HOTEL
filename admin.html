<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Udy Hotel & Apartments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Udy Hotel - Manager Dashboard</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="admin.html">Admin Portal</a>
      <a href="receptionist-hotel.html">Hotel Desk</a>
      <a href="receptionist-apt.html">Apartment Desk</a>
    </nav>
  </header>

  <div class="container">
    <h2>Management Control Center</h2>

    <!-- Add New Room / Apartment Section -->
    <div class="card">
      <h3>Add New Room or Apartment</h3>
      <form id="addRoomForm">
        <label>Property Location</label>
        <select id="propertyType" required>
          <option value="hotel">Udy Hotel (Main Branch)</option>
          <option value="apartment">Udy Apartments (City Annex)</option>
        </select>

        <label>Room/Apartment Name & Number</label>
        <input type="text" id="roomName" placeholder="e.g., Deluxe Suite 101" required>

        <label>Price per Night ($)</label>
        <input type="number" id="roomPrice" placeholder="150" required>

        <label>Image URL</label>
        <input type="url" id="roomImage" placeholder="https://example.com/image.jpg" required>

        <button type="submit">Publish Listing</button>
      </form>
    </div>

    <!-- Live Bookings and Records -->
    <div class="card">
      <h3>Live Guest Records & Bookings</h3>
      <table>
        <thead>
          <tr>
            <th>Guest Name</th>
            <th>Property</th>
            <th>Room / Unit</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="adminBookingsTable">
          <tr>
            <td colspan="6">Loading real-time records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { db, collection, addDoc, onSnapshot } from "./app.js";

    // Handle adding new property units
    const addRoomForm = document.getElementById('addRoomForm');
    addRoomForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const propertyType = document.getElementById('propertyType').value;
      const name = document.getElementById('roomName').value;
      const price = document.getElementById('roomPrice').value;
      const imageUrl = document.getElementById('roomImage').value;

      try {
        await addDoc(collection(db, "rooms"), {
          propertyType,
          name,
          price: Number(price),
          imageUrl,
          available: true,
          createdAt: new Date()
        });
        alert('Room/Apartment added successfully!');
        addRoomForm.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        alert('Failed to add listing.');
      }
    });

    // Real-time listener for bookings
    const bookingsTable = document.getElementById('adminBookingsTable');
    onSnapshot(collection(db, "bookings"), (snapshot) => {
      let html = '';
      snapshot.forEach((doc) => {
        const b = doc.data();
        html += `
          <tr>
            <td>${b.guestName}</td>
            <td>${b.propertyType.toUpperCase()}</td>
            <td>${b.roomName}</td>
            <td>${b.checkIn}</td>
            <td>${b.checkOut}</td>
            <td>${b.status || 'Confirmed'}</td>
          </tr>
        `;
      });
      if (html === '') {
        html = '<tr><td colspan="6">No active bookings found.</td></tr>';
      }
      bookingsTable.innerHTML = html;
    });
  </script>
</body>
</html>
